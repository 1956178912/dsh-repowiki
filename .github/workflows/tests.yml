name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: '22'
            blocking: true
          - os: ubuntu-latest
            node: '24'
            blocking: true
          - os: macos-latest
            node: '22'
            blocking: true
          - os: windows-latest
            node: '22'
            blocking: false
    continue-on-error: ${{ !matrix.blocking }}
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dev dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Secret scan
        run: npm run scan:secrets
      - name: Run test suite
        run: npm test

  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run coverage:check

  verify-wiki:
    name: wiki freshness gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fixture wiki
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises'
          import { digestText } from './src/util.js'

          const root = '.ci-fixture'
          const asset = `${root}/.dsh-repowiki`
          const cardDigest = 'card-digest-1'
          await mkdir(`${asset}/knowledge/zh`, { recursive: true })
          await mkdir(`${asset}/wiki/zh`, { recursive: true })
          await writeFile(`${root}/a.ts`, 'one\ntwo\n')
          await writeFile(`${asset}/index.json`, JSON.stringify({
            schemaVersion: 6,
            files: [{ path: 'a.ts', lines: 2 }],
          }, null, 2))
          await writeFile(`${asset}/knowledge/zh/a.md`, [
            '---',
            JSON.stringify({
              schemaVersion: 1,
              path: 'a.ts',
              lang: 'typescript',
              locale: 'zh',
              sourceDigest: cardDigest,
              title: 'A',
              tags: [],
              manuallyEdited: false,
              generatedAt: '2026-01-01T00:00:00.000Z',
            }),
            '---',
            '# A',
            '',
          ].join('\n'))
          await writeFile(`${asset}/wiki/zh/overview.md`, [
            '---',
            JSON.stringify({ slug: 'overview', title: 'Overview' }),
            '---',
            '# Overview',
            '',
          ].join('\n'))
          await writeFile(`${asset}/wiki/zh/_index.json`, JSON.stringify({
            schemaVersion: 3,
            inputDigest: digestText(`a.ts:${cardDigest}`, 16),
            memoryDigest: digestText('', 16),
            pages: [{
              slug: 'overview',
              path: 'wiki/zh/overview.md',
              title: 'Overview',
              sources: [],
              sections: [],
            }],
          }, null, 2))
          NODE
      - name: Gate passes on a fresh wiki
        run: node scripts/verify-wiki.mjs --root .ci-fixture --strict --require
      - name: Gate fails after a card changes
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const file = '.ci-fixture/.dsh-repowiki/knowledge/zh/a.md'
          const text = await readFile(file, 'utf8')
          await writeFile(file, text.replace('card-digest-1', 'card-digest-2'))
          NODE
          set +e
          node scripts/verify-wiki.mjs --root .ci-fixture --strict --require
          code=$?
          set -e
          test "$code" -eq 1

  verify-arch:
    name: architecture baseline gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build fixture index
        run: |
          node --input-type=module <<'NODE'
          import { mkdir, writeFile } from 'node:fs/promises'

          const root = '.ci-arch'
          await mkdir(`${root}/.dsh-repowiki`, { recursive: true })
          await writeFile(`${root}/a.js`, 'function a() {\n  return 1\n}\n')
          await writeFile(`${root}/b.js`, 'function b() {\n  return 2\n}\n')
          await writeFile(`${root}/.dsh-repowiki/index.json`, JSON.stringify({
            schemaVersion: 6,
            files: [
              {
                path: 'a.js',
                lang: 'javascript',
                symbols: [{ name: 'a', kind: 'function', line: 1, endLine: 3 }],
                imports: [{ specifier: './b', line: 1, relative: true }],
              },
              {
                path: 'b.js',
                lang: 'javascript',
                symbols: [{ name: 'b', kind: 'function', line: 1, endLine: 3 }],
                imports: [{ specifier: './a', line: 1, relative: true }],
              },
            ],
            edges: [
              { from: 'a.js', to: 'b.js', line: 1, kind: 'import' },
              { from: 'b.js', to: 'a.js', line: 1, kind: 'import' },
            ],
          }, null, 2))
          NODE
      - name: Missing baseline fails under --require
        run: |
          set +e
          node scripts/verify-arch.mjs --root .ci-arch --require
          code=$?
          set -e
          test "$code" -eq 1
      - name: Baseline write and clean check
        run: |
          node scripts/verify-arch.mjs --root .ci-arch --update
          node scripts/verify-arch.mjs --root .ci-arch --require --json > arch-report.json
          node --input-type=module -e "
            import { readFileSync } from 'node:fs'
            const report = JSON.parse(readFileSync('arch-report.json', 'utf8'))
            if (!report.ok || report.regressions.length !== 0) process.exit(1)
            if (report.current.cycles.length !== 1) process.exit(1)
          "
      - name: New cycle fails the gate
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises'

          const file = '.ci-arch/.dsh-repowiki/index.json'
          const index = JSON.parse(await readFile(file, 'utf8'))
          index.files.push(
            { path: 'c.js', lang: 'javascript', symbols: [], imports: [] },
            { path: 'd.js', lang: 'javascript', symbols: [], imports: [] },
          )
          index.edges.push(
            { from: 'c.js', to: 'd.js', line: 1, kind: 'import' },
            { from: 'd.js', to: 'c.js', line: 1, kind: 'import' },
          )
          await writeFile(file, JSON.stringify(index, null, 2))
          await writeFile('.ci-arch/c.js', 'const c = 1\n')
          await writeFile('.ci-arch/d.js', 'const d = 2\n')
          NODE
          set +e
          node scripts/verify-arch.mjs --root .ci-arch --require > arch-failure.txt
          code=$?
          set -e
          test "$code" -eq 1
          grep -q "new import cycle group" arch-failure.txt

  audit:
    name: dependency audit + SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: npm audit (high and above)
        run: npm audit --audit-level=high
      - name: SBOM (CycloneDX)
        continue-on-error: true
        run: npm sbom --sbom-format=cyclonedx > sbom.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore
